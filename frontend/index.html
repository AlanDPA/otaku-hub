<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
    <title>Otaku Hub</title>

    <script type="module" src="src/js/main.js"></script>
  </head>
  <body
    class="bg-gray-950 text-white min-h-screen flex flex-col justify-between gap-3"
  >
    <div class="w-full max-w-300 mx-auto p-5 flex flex-wrap-reverse gap-5 justify-between items-center">
      
      <div
        class="flex flex-wrap items-center justify-center gap-3"
      >
        <label for="search-anime" class="font-semibold text-sm sm:text-base"
          >Search:</label
        >
        <input
          type="text"
          name="search-anime"
          id="search-anime"
          class="outline outline-white rounded-sm pl-2 text-sm sm:text-base w-25 sm:w-50"
        />
      </div>
      <h1 class="text-2xl sm:text-3xl text-center font-bold">Otaku Hub</h1>
    </div>

    <div
      id="cards-container"
      class="py-2 px-1 grid grid-cols-[repeat(auto-fit,125px)] sm:grid-cols-[repeat(auto-fit,200px)] gap-5 justify-center w-full max-w-300 mx-auto"
    ></div>

    <div
      id="buttons-container"
      class="flex flex-row gap-3 justify-center py-2"
    ></div>

    <template id="card-template">
      <a href="" class="flex flex-col gap-2 sm:h-90 text-gray-900">
        <div class="relative h-50 sm:h-80">
          <img
            src=""
            data-images
            loading="lazy"
            class="object-cover object-center w-full h-full z-0 relative rounded-lg"
          />
          <p
            data-score
            class="text-right text-white text-xs font-semibold bg-gray-900 rounded-sm px-2 py-1 absolute top-1 right-1"
          ></p>
          <p
            data-status
            class="text-left text-white text-xs font-semibold bg-gray-900 rounded-sm px-2 py-1 mx-1 absolute bottom-1 line-clamp-1"
          ></p>
        </div>

        <p
          data-title
          class="text-left font-semibold text-white text-xs sm:text-sm line-clamp-2 px-1 sm:px-2"
        ></p>
      </a>
    </template>
  </body>
</html>
