<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
    <title>Otaku Hub</title>
    <script type="module" src="src/js/detail.js"></script>
  </head>
  <body
    class="bg-gray-950 text-white min-h-screen flex flex-col justify-baseline gap-5"
  >
    <div
      class="w-full max-w-300 mx-auto p-5 flex flex-wrap-reverse gap-5 justify-between items-center"
    >
      <a
        href="index.html"
        class="px-3 py-1 bg-white text-gray-900 rounded-sm font-semibold text-sm sm:text-base"
        >Back to list</a
      >
      <h1 class="text-2xl sm:text-3xl text-center font-bold">Otaku Hub</h1>
    </div>
    <main
      id="anime-detail-container"
      class="sm:p-5 w-full max-w-300 mx-auto"
    ></main>

    <template id="anime-detail-template">
      <div class="w-full sm:rounded-2xl overflow-hidden relative">
        <img
          data-images-01
          src=""
          alt=""
          class="absolute top-0 right-0 w-full h-full z-0 object-cover object-top-right"
        />

        <div
          class="bg-linear-to-r from-gray-900 via-gray-800 to-transparent absolute top-0 left-0 w-full h-full z-10"
        ></div>
        <div
          class="relative z-20 flex flex-row justify-center items-center p-5"
        >
          <img
            data-images-02
            src=""
            alt=""
            class="w-50 h-80 object-cover rounded-lg hidden sm:block"
          />

          <article
            class="px-1 sm:px-5 flex flex-col justify-baseline gap-5"
          >
            <h3 data-title class="text-2xl sm:text-3xl font-bold"></h3>
            <ul
              class="flex flex-wrap gap-3 text-xs sm:text-sm list-disc list-inside"
            >
              <li data-rating></li>
              <li data-type></li>
              <li data-status></li>
              <li data-aired-string></li>
            </ul>
            <div
              data-genres-name
              class="flex flex-wrap gap-3 text-xs sm:text-sm"
            ></div>
            <div
              data-genres-explicit-genres-name
              class="flex flex-wrap gap-3 text-xs sm:text-sm"
            ></div>
            <p
              data-synopsis
              class="text-xs sm:text-sm rounded-sm h-30 overflow-y-auto"
            ></p>

            <div class="flex flex-wrap items-center gap-3 text-xs sm:text-sm">
              <p
                class="text-2xl font-semibold sm:text-3xl leading-none flex flex-row gap-2"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  width="1em"
                  height="1em"
                  class="shrink-0 text-amber-300"
                >
                  <path
                    fill-rule="evenodd"
                    d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                    clip-rule="evenodd"
                  />
                </svg>
                <span data-score></span>
              </p>
              <p data-score-by class="w-20"></p>
            </div>
          </article>
        </div>
      </div>
    </template>
  </body>
</html>
